<div class="container">
  <div *ngIf="loading" class="loading-overlay">
    <mat-spinner></mat-spinner>
  </div>

  <button (click)="onNoClick()" class="close-button" mat-icon-button tabindex="-1">
    <span class="material-symbols-rounded">close</span>
  </button>

  <div class="info-and-picture">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Artist</mat-label>
      <mat-select [(ngModel)]="selectedArtistId" placeholder="Select artist">
        <mat-option *ngFor="let artist of availableArtists" [value]="artist.id">
          {{ artist.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Genres</mat-label>
      <mat-select [(ngModel)]="selectedGenreIds" multiple placeholder="Select genres">
        <mat-option *ngFor="let genre of availableGenres" [value]="genre.id">
          {{ genre.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <app-upload-image-box class="picture"></app-upload-image-box>
  </div>

  <button (click)="create()" class="orange-button finish">Create</button>
</div>
