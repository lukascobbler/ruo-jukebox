<div class="container">
  <button (click)="onNoClick()" class="close-button" mat-icon-button tabindex="-1">
    <span class="material-symbols-rounded">close</span>
  </button>

  <div class="info-and-picture">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput/>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-select placeholder="Artist">
        <mat-option [value]="'artist1'">Awesome artist 1</mat-option>
        <mat-option [value]="'artist2'">Awesome artist 2</mat-option>
        <mat-option [value]="'artist3'">Awesome artist 3</mat-option>
        <mat-option [value]="'artist4'">Awesome artist 4</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-select placeholder="Genres">
        <mat-option [value]="'rock'">Rock</mat-option>
        <mat-option [value]="'jazz'">Jazz</mat-option>
        <mat-option [value]="'classical'">Classical</mat-option>
        <mat-option [value]="'pop'">Pop</mat-option>
      </mat-select>
    </mat-form-field>
    <app-upload-image-box class="picture"></app-upload-image-box>
  </div>

  <button (click)="closeDialog()" [disabled]="false" class="orange-button finish">
    Create
  </button>
</div>
