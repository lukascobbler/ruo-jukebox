<div class="container">
  <button (click)="onNoClick()" class="close-button" mat-icon-button tabindex="-1">
    <span class="material-symbols-rounded">close</span>
  </button>

  <mat-form-field appearance="outline">
    <mat-select placeholder="Playlist">
      <mat-option [value]="'test1'">Playlist 1</mat-option>
      <mat-option [value]="'test2'">Playlist 2</mat-option>
      <mat-option [value]="'test3'">Playlist 3</mat-option>
      <mat-option [value]="'test4'">Playlist 4</mat-option>
    </mat-select>
  </mat-form-field>

  <button (click)="closeDialog()" [disabled]="false" class="orange-button finish">
    Add
  </button>
</div>
