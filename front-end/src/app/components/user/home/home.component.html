<div *ngIf="loading" class="loading">
  <mat-spinner></mat-spinner>
</div>
<div *ngIf="!loading" class="container">
  <button (click)="auth.logout(); playerService.destroy();" class="logout-button orange-button">Logout</button>
  <div class="search-container">
    <div class="search">
      <app-search />
    </div>
  </div>

  <div class="recommended-entities">
    <div>
      <p class="big-text">Recommended albums</p>
      <div class="recommended-albums horizontal-scroller">
        <div *ngFor="let album of albums" class="single-album">
          <button class="icon-button" (click)="router.navigate(['musical-content', album.content_id])">
            <img *ngIf="album.cover_url; else missingCoverAlbum" [src]="album.cover_url" alt="cover" class="cover-picture-big"/>
            <ng-template #missingCoverAlbum>
              <app-box-missing-icon-x-large [icon_name]="'album'" class="cover-no-picture"></app-box-missing-icon-x-large>
            </ng-template>
          </button>
          <p class="album-name">{{ album.name }}</p>
          <p class="artist-name">{{ getArtists(album) }}</p>
        </div>
      </div>
    </div>
    <div>
      <p class="big-text">Recommended artists</p>
      <div class="recommended-artists horizontal-scroller">
        <div *ngFor="let artist of artists" class="single-artist">
          <button class="icon-button" (click)="router.navigate(['artist', artist.artist_id])">
            <img *ngIf="artist.cover_url; else missingCoverArtist" [src]="artist.cover_url" alt="cover" class="cover-picture-big"/>
            <ng-template #missingCoverArtist>
              <app-round-missing-icon-x-large [icon_name]="'artist'" class="cover-no-picture"></app-round-missing-icon-x-large>
            </ng-template>
          </button>
          <p class="artist-name">{{ artist.name }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="recommended-songs">
    <p class="big-text center-text">Recommended songs</p>
    <app-song-table
      class="song-table"
      [songs]="songs"
    ></app-song-table>
  </div>
</div>
