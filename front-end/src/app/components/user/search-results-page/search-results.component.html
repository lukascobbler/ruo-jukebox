<div class="loading" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
<div *ngIf="!loading" class="container">
  <button (click)="auth.logout(); playerService.destroy();" class="logout-button orange-button">Logout</button>
  <div class="search-container">
    <div class="search">
      <app-search [searchTerm]="searchTerm" />
    </div>
  </div>

  <div *ngIf="searchResult!.albums.length === 0 &&
       searchResult!.artists.length === 0 &&
       searchResult!.songs.length === 0" class="no-content">
    <p>No Content</p>
  </div>

  <div class="discover-entities">
    <div *ngIf="searchResult!.songs.length !== 0">
      <p class="big-text">Matching songs</p>
      <div class="found-songs horizontal-scroller">
        <div *ngFor="let song of searchResult!.songs" class="single-song">
          <button *ngIf="song.album_id" class="icon-button" (click)="router.navigate(['album', song.album_id])">
            <img *ngIf="song.cover_url; else missingCoverSong1" [src]="song.cover_url" alt="cover" class="cover-picture-medium"/>
            <ng-template #missingCoverSong1>
              <app-box-missing-icon-small [icon_name]="'music_note'" class="cover-no-picture"></app-box-missing-icon-small>
            </ng-template>
          </button>
          <button *ngIf="song.single_id" class="icon-button" (click)="router.navigate(['single', song.single_id])">
            <img *ngIf="song.cover_url; else missingCoverSong2" [src]="song.cover_url" alt="cover" class="cover-picture-medium"/>
            <ng-template #missingCoverSong2>
              <app-box-missing-icon-small [icon_name]="'music_note'" class="cover-no-picture"></app-box-missing-icon-small>
            </ng-template>
          </button>
          <p class="song-name">{{ song.name }}</p>
          <p class="artist-name">{{ getArtists(song) }}</p>
        </div>
      </div>
    </div>
    <div *ngIf="searchResult!.albums.length !== 0">
      <p class="big-text">Matching albums</p>
      <div class="found-albums horizontal-scroller">
        <div *ngFor="let album of searchResult!.albums" class="single-album">
          <button class="icon-button" (click)="router.navigate(['album', album.content_id])">
            <img *ngIf="album.cover_url; else missingCoverAlbum" [src]="album.cover_url" alt="cover" class="cover-picture-medium"/>
            <ng-template #missingCoverAlbum>
              <app-box-missing-icon-large [icon_name]="'album'" class="cover-no-picture"></app-box-missing-icon-large>
            </ng-template>
          </button>
          <p class="album-name">{{ album.name }}</p>
          <p class="artist-name">{{ getArtists(album) }}</p>
        </div>
      </div>
    </div>
    <div *ngIf="searchResult!.artists.length !== 0">
      <p class="big-text">Matching artists</p>
      <div class="found-artists horizontal-scroller">
        <div *ngFor="let artist of searchResult!.artists" class="single-artist">
          <button class="icon-button" (click)="router.navigate(['artist', artist.artist_id])">
            <img *ngIf="artist.cover_url; else missingCoverArtist" [src]="artist.cover_url" alt="cover" class="cover-picture-medium"/>
            <ng-template #missingCoverArtist>
              <app-round-missing-icon-large [icon_name]="'artist'" class="cover-no-picture"></app-round-missing-icon-large>
            </ng-template>
          </button>
          <p class="artist-name">{{ artist.name }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
