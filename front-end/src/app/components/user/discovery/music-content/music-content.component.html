<div *ngIf="loading" class="loading">
  <mat-spinner></mat-spinner>
</div>

<div *ngIf="!loading" class="container">
  <button (click)="auth.logout(); playerService.destroy();" class="logout-button orange-button">Logout</button>

  <div class="search-container">
    <div class="search">
      <app-search></app-search>
    </div>
  </div>

  <div *ngIf="genre!.albums!.length === 0 && genre!.artists!.length === 0" class="no-content">
    <p>No Content</p>
  </div>

  <div class="discover-entities">
    <ng-container *ngIf="genre!.albums!.length > 0">
      <p class="big-text">Discover albums</p>
      <div class="discover-albums horizontal-scroller">
        <div *ngFor="let album of genre!.albums" class="single-album">
          <button class="icon-button" (click)="router.navigate(['album', album.content_id])">
            <img *ngIf="album.cover_url; else missingCoverAlbum" [src]="album.cover_url" alt="cover" class="cover-picture-big"/>
            <ng-template #missingCoverAlbum>
              <app-box-missing-icon-x-large [icon_name]="'album'" class="cover-no-picture"></app-box-missing-icon-x-large>
            </ng-template>
          </button>
          <p class="album-name">{{ album.name }}</p>
          <p class="artist-name">{{ getArtists(album) }}</p>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="genre!.artists!.length > 0">
      <p class="big-text">Discover artists</p>
      <div class="discover-artists horizontal-scroller">
        <div *ngFor="let artist of genre!.artists" class="single-artist">
          <button class="icon-button" (click)="router.navigate(['artist', artist.artist_id])">
            <img *ngIf="artist.cover_url; else missingCoverArtist" [src]="artist.cover_url" alt="cover" class="cover-picture-big"/>
            <ng-template #missingCoverArtist>
              <app-box-missing-icon-x-large [icon_name]="'album'" class="cover-no-picture"></app-box-missing-icon-x-large>
            </ng-template>
          </button>
          <p class="artist-name">{{ artist.name }}</p>
        </div>
      </div>
    </ng-container>
  </div>
</div>
